<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>視障語音節拍器</title>
<meta name="theme-color" content="#101010">
<meta name="description" content="專為視障者設計的節拍器 App">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: #101010; color: #fff;
  font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
  overflow: hidden; user-select: none;
}
body { display: flex; flex-direction: column; }

/* ===== 頂部標題 ===== */
#header {
  text-align: center;
  padding: env(safe-area-inset-top) 16px 16px;
  background: #101010;
}
#header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 700;
  color: #D4AF37;
}

/* ===== BPM 大數字 + Slider ===== */
#bpmSection {
  text-align: center;
  padding: 32px 24px 24px;
  background: #101010;
}
#bigBpm {
  font-size: 92px;
  font-weight: 900;
  line-height: 1;
  color: #fff;
  margin: 0;
}
#bpmLabel {
  font-size: 20px;
  color: #D4AF37;
  margin-top: 8px;
}
#sliderContainer {
  margin-top: 24px;
  padding: 0 16px;
}
#bpmSlider {
  width: 100%;
  height: 40px;
  -webkit-appearance: none;
  background: #292929;
  border-radius: 20px;
  outline: none;
}
#bpmSlider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #D4AF37;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* ===== 播放控制按鈕 ===== */
#playControls {
  display: flex;
  justify-content: center;
  gap: 16px;
  padding: 16px;
}
.btn {
  min-width: 80px;
  min-height: 56px;
  font-size: 20px;
  font-weight: 600;
  border: none;
  border-radius: 28px;
  cursor: pointer;
  transition: all 0.2s;
}
.btnPlay {
  background: #D4AF37;
  color: #000;
  min-width: 160px;
}
.btnPlay.playing {
  background: #8B2020;
  color: #fff;
}
.btnSpeed {
  background: #292929;
  color: #fff;
}

/* ===== 拍號卡片 ===== */
#beatSection {
  padding: 16px;
  background: #101010;
}
.sectionTitle {
  font-size: 16px;
  color: #D4AF37;
  margin: 0 0 12px;
  font-weight: 600;
}
.beatRow {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.beatBtn {
  flex: 1;
  min-width: 60px;
  min-height: 56px;
  font-size: 16px;
  font-weight: 600;
  border: 2px solid #444;
  border-radius: 12px;
  background: #101010;
  color: #888;
  cursor: pointer;
  transition: all 0.2s;
}
.beatBtn.active {
  border-color: #D4AF37;
  background: #1a1a1a;
  color: #D4AF37;
}

/* ===== 4/4 特殊拍位 ===== */
#accentSection {
  padding: 16px;
  background: #101010;
  display: none; /* 只有 4/4 才顯示 */
}
.accentRow {
  display: flex;
  gap: 12px;
}
.accentBtn {
  flex: 1;
  min-height: 56px;
  font-size: 16px;
  font-weight: 600;
  border: 2px solid #444;
  border-radius: 12px;
  background: #101010;
  color: #888;
  cursor: pointer;
}
.accentBtn.active {
  border-color: #D4AF37;
  background: #1a1a1a;
  color: #D4AF37;
}

/* ===== 音效卡片 ===== */
#soundSection {
  padding: 16px;
  background: #101010;
}
.soundRow {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.soundBtn {
  flex: 1;
  min-width: 70px;
  min-height: 56px;
  font-size: 14px;
  font-weight: 600;
  border: 2px solid #444;
  border-radius: 12px;
  background: #101010;
  color: #888;
  cursor: pointer;
}
.soundBtn.active {
  border-color: #D4AF37;
  background: #1a1a1a;
  color: #D4AF37;
}

/* ===== 語音輸入按鈕 ===== */
#voiceSection {
  padding: 16px;
  background: #101010;
  text-align: center;
}
#voiceBtn {
  min-width: 200px;
  min-height: 56px;
  font-size: 18px;
  font-weight: 600;
  border: 2px solid #444;
  border-radius: 28px;
  background: #101010;
  color: #D4AF37;
  cursor: pointer;
}
#voiceBtn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
#voiceMsg {
  margin-top: 12px;
  font-size: 16px;
  color: #D4AF37;
  min-height: 24px;
}

/* ===== 底部狀態列 ===== */
#footer {
  text-align: center;
  padding: 12px 16px env(safe-area-inset-bottom);
  background: #0a0a0a;
  font-size: 16px;
  color: #D4AF37;
  font-weight: 600;
}

/* ===== 語音輸入說明 ===== */
#voiceHint {
  text-align: center;
  font-size: 12px;
  color: #666;
  padding: 8px 16px;
  background: #101010;
}
</style>
</head>
<body>

<!-- 頂部標題 -->
<div id="header">
  <h1>視障語音節拍器</h1>
</div>

<!-- BPM 大數字 + Slider -->
<div id="bpmSection">
  <div id="bigBpm" aria-live="polite" aria-label="目前速度">120</div>
  <div id="bpmLabel">BPM</div>
  <div id="sliderContainer">
    <input type="range" id="bpmSlider" min="40" max="240" value="120" aria-label="調整速度">
  </div>
</div>

<!-- 播放控制 -->
<div id="playControls">
  <button class="btn btnSpeed" id="btnSlower" aria-label="變慢">− 變慢</button>
  <button class="btn btnPlay" id="btnPlay" aria-label="播放">▶ 播放</button>
  <button class="btn btnSpeed" id="btnFaster" aria-label="加快">＋ 加快</button>
</div>

<!-- 拍號選擇 -->
<div id="beatSection">
  <h2 class="sectionTitle">拍號</h2>
  <div class="beatRow">
    <button class="beatBtn" data-beats="2" aria-label="2/4 拍">2/4</button>
    <button class="beatBtn" data-beats="3" aria-label="3/4 拍">3/4</button>
    <button class="beatBtn active" data-beats="4" aria-label="4/4 拍">4/4</button>
    <button class="beatBtn" data-beats="5" aria-label="5/8 拍">5/8</button>
    <button class="beatBtn" data-beats="6" aria-label="6/8 拍">6/8</button>
  </div>
</div>

<!-- 4/4 特殊拍位 -->
<div id="accentSection">
  <h2 class="sectionTitle">4/4 特殊拍位</h2>
  <div class="accentRow">
    <button class="accentBtn active" data-pattern="ONE_THREE" aria-label="第1、3拍">第 1、3 拍</button>
    <button class="accentBtn" data-pattern="TWO_FOUR" aria-label="第2、4拍">第 2、4 拍</button>
  </div>
</div>

<!-- 音效選擇 -->
<div id="soundSection">
  <h2 class="sectionTitle">節拍音效</h2>
  <div class="soundRow">
    <button class="soundBtn active" data-sound="1" aria-label="音效 1">音效 1</button>
    <button class="soundBtn" data-sound="2" aria-label="音效 2">音效 2</button>
    <button class="soundBtn" data-sound="3" aria-label="音效 3">音效 3</button>
    <button class="soundBtn" data-sound="4" aria-label="音效 4">音效 4</button>
    <button class="soundBtn" data-sound="VOICE" aria-label="人聲數拍">人聲</button>
  </div>
</div>

<!-- 語音輸入 -->
<div id="voiceSection">
  <button id="voiceBtn" aria-label="語音設定速度">🎤 語音設定速度</button>
  <div id="voiceMsg" aria-live="polite"></div>
</div>

<!-- 底部狀態列 -->
<div id="footer">
  <span id="statusText">已停止</span>
</div>

<!-- 語音輸入說明 -->
<div id="voiceHint">
  語音輸入：說「一百二十」設為 120 BPM（僅 Android Chrome 支援）
</div>

<script>
(function () {
  "use strict";

  // ===== 狀態 =====
  let bpm = 120;
  let beatsPerBar = 4;
  let soundType = '1';  // '1', '2', '3', '4', 'VOICE'
  let accentPattern = 'ONE_THREE'; // 'ONE_THREE' 或 'TWO_FOUR'
  let isPlaying = false;
  let currentBeat = 0;
  let timerID = null;

  // ===== DOM =====
  const $bigBpm = document.getElementById('bigBpm');
  const $slider = document.getElementById('bpmSlider');
  const $btnPlay = document.getElementById('btnPlay');
  const $btnSlower = document.getElementById('btnSlower');
  const $btnFaster = document.getElementById('btnFaster');
  const $beatBtns = document.querySelectorAll('.beatBtn');
  const $accentSection = document.getElementById('accentSection');
  const $accentBtns = document.querySelectorAll('.accentBtn');
  const $soundBtns = document.querySelectorAll('.soundBtn');
  const $voiceBtn = document.getElementById('voiceBtn');
  const $voiceMsg = document.getElementById('voiceMsg');
  const $statusText = document.getElementById('statusText');

  // ===== Web Audio =====
  let audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  // ===== 音效合成（4 種音效 + 人聲） =====
  function playSound(isAccent) {
    ensureAudio();
    const now = audioCtx.currentTime;

    if (soundType === 'VOICE') {
      // 人聲數拍
      const beatNum = (currentBeat % beatsPerBar) + 1;
      speakBeat(beatNum);
      return;
    }

    // 音效 1-4（不同頻率/波形）
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    // 音效參數
    const sounds = {
      '1': { type: 'triangle', freq: isAccent ? 1250 : 830 },
      '2': { type: 'sine', freq: isAccent ? 1100 : 700 },
      '3': { type: 'square', freq: isAccent ? 2600 : 1900 },
      '4': { type: 'sawtooth', freq: isAccent ? 900 : 600 }
    };

    const s = sounds[soundType] || sounds['1'];
    osc.type = s.type;
    osc.frequency.setValueAtTime(s.freq, now);

    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);

    osc.start(now);
    osc.stop(now + 0.15);
  }

  // ===== 人聲數拍 =====
  function speakBeat(num) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(num.toString());
      utterance.lang = 'zh-TW';
      utterance.rate = 1.1;
      utterance.volume = 0.8;
      speechSynthesis.speak(utterance);
    }
  }

  // ===== 播放迴圈 =====
  function tick() {
    const isAccent = isAccentBeat(currentBeat);
    playSound(isAccent);

    // 更新狀態列
    const beatNum = (currentBeat % beatsPerBar) + 1;
    $statusText.textContent = `播放中・第 ${beatNum} 拍`;

    currentBeat++;
    const interval = 60000 / bpm;
    timerID = setTimeout(tick, interval);
  }

  function isAccentBeat(beat) {
    const pos = beat % beatsPerBar;
    if (beatsPerBar === 4) {
      // 4/4 依 accentPattern
      if (accentPattern === 'ONE_THREE') {
        return pos === 0 || pos === 2;  // 第 1, 3 拍
      } else {
        return pos === 1 || pos === 3;  // 第 2, 4 拍
      }
    } else {
      // 其他拍號：第 1 拍重音
      return pos === 0;
    }
  }

  function start() {
    if (isPlaying) return;
    isPlaying = true;
    currentBeat = 0;
    ensureAudio();
    tick();

    $btnPlay.textContent = '■ 停止';
    $btnPlay.classList.add('playing');
    $btnPlay.setAttribute('aria-label', '停止');
  }

  function stop() {
    if (!isPlaying) return;
    isPlaying = false;
    if (timerID) {
      clearTimeout(timerID);
      timerID = null;
    }

    $btnPlay.textContent = '▶ 播放';
    $btnPlay.classList.remove('playing');
    $btnPlay.setAttribute('aria-label', '播放');
    $statusText.textContent = '已停止';
  }

  // ===== BPM 控制 =====
  function updateBPM(newBpm) {
    bpm = Math.max(40, Math.min(240, newBpm));
    $bigBpm.textContent = bpm;
    $slider.value = bpm;
    $bigBpm.setAttribute('aria-label', `目前速度 ${bpm}`);
  }

  // ===== 語音輸入 =====
  let recognition = null;

  function initSpeechRecognition() {
    if (!('webkitSpeechRecognition' in window)) {
      $voiceBtn.disabled = true;
      $voiceBtn.textContent = '🎤 此裝置不支援語音輸入';
      return;
    }

    recognition = new webkitSpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'zh-TW';

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      // 解析數字（「一百二十」→ 120）
      const num = parseChineseNumber(transcript);
      if (num >= 40 && num <= 240) {
        updateBPM(num);
        $voiceMsg.textContent = `速度設定為 ${num} BPM`;
      } else {
        $voiceMsg.textContent = `無法辨識，請說「四十」到「兩百四十」`;
      }
    };

    recognition.onerror = (event) => {
      $voiceMsg.textContent = '語音辨識錯誤，請重試';
    };

    recognition.onend = () => {
      $voiceBtn.textContent = '🎤 語音設定速度';
    };
  }

  function parseChineseNumber(text) {
    // 簡單解析：提取數字
    const match = text.match(/(\d+)/);
    if (match) return parseInt(match[1]);

    // 中文數字（簡化版）
    const cnNums = { '四':40,'五':50,'六':60,'七':70,'八':80,'九':90,'一百':100,'一百一':110,'一百二':120,'一百三':130,'一百四':140,'一百五':150,'一百六':160,'一百七':170,'一百八':180,'一百九':190,'兩百':200 };
    for (let key in cnNums) {
      if (text.includes(key)) return cnNums[key];
    }

    return 0;
  }

  // ===== 事件綁定 =====
  $btnPlay.addEventListener('click', () => {
    if (isPlaying) stop(); else start();
  });

  $btnSlower.addEventListener('click', () => updateBPM(bpm - 5));
  $btnFaster.addEventListener('click', () => updateBPM(bpm + 5));

  $slider.addEventListener('input', (e) => {
    updateBPM(parseInt(e.target.value));
  });

  // 拍號選擇
  $beatBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      $beatBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      beatsPerBar = parseInt(btn.dataset.beats);

      // 只有 4/4 顯示特殊拍位
      $accentSection.style.display = (beatsPerBar === 4) ? 'block' : 'none';
    });
  });

  // 4/4 特殊拍位
  $accentBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      $accentBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      accentPattern = btn.dataset.pattern;
    });
  });

  // 音效選擇
  $soundBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      $soundBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      soundType = btn.dataset.sound;
    });
  });

  // 語音輸入
  $voiceBtn.addEventListener('click', () => {
    if (!recognition) return;
    try {
      recognition.start();
      $voiceBtn.textContent = '🎤 聽取中...';
      $voiceMsg.textContent = '';
    } catch (e) {
      $voiceMsg.textContent = '語音辨識啟動失敗';
    }
  });

  // ===== 初始化 =====
  initSpeechRecognition();

  // Service Worker 註冊
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
