<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>視障節拍器</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="專為視障者設計、搭配 TalkBack 使用的節拍器">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff;
    font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    overflow: hidden; user-select: none;
  }
  body { display: flex; flex-direction: column; }

  /* 頂部狀態列（TalkBack 會自動報讀這裡的變化） */
  #topbar {
    padding: env(safe-area-inset-top) 16px 8px;
    text-align: center; font-size: 18px; line-height: 1.5;
    background: #111;
  }
  #status { font-weight: bold; }
  #bpmValue { font-size: 22px; color: #FFD54A; font-weight: bold; }

  /* 主顯示區（純視覺，TalkBack 不需讀這裡，因頂部已報讀） */
  #display {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #000;
    position: relative;
  }
  #bigBpm { font-size: 120px; font-weight: 900; line-height: 1; color: #FFD54A; }
  #bigBpmLabel { font-size: 20px; color: #aaa; margin-top: 4px; }
  #beatDots { display: flex; gap: 14px; margin-top: 24px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #333; border: 2px solid #555; }
  .dot.active { background: #FFD54A; border-color: #FFD54A; }
  .dot.downbeat.active { background: #fff; border-color: #fff; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.04s; }
  #flash.downbeat { background: #FFD54A; }

  /* 操作說明（給明眼人看；TalkBack 也會讀一次） */
  #hint { text-align: center; font-size: 14px; color: #888; padding: 6px 16px; background: #0a0a0a; line-height: 1.5; }

  /* 底部操作按鈕（TalkBack 主要報讀對象） */
  #controls { padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); background: #111; display: flex; gap: 10px; }
  .btn {
    flex: 1; min-height: 72px; font-size: 22px; font-weight: bold;
    border: none; border-radius: 14px; color: #fff;
    display: flex; align-items: center; justify-content: center;
    background: #1f6feb;
  }
  .btn:active { transform: scale(0.97); }
  #btnSlower { background: #424242; }
  #btnFaster { background: #424242; }
  #btnToggle { background: #2e7d32; }
  #btnToggle.playing { background: #c62828; }
  .btn-wide { width: 100%; }
  #btnVoice { background: #6a1b9a; min-height: 64px; font-size: 20px; }
  #btnVoice.listening { background: #c62828; }

  #err { position: fixed; top: 0; left: 0; right: 0; background: #b71c1c; color: #fff; padding: 12px 16px; font-size: 15px; display: none; z-index: 99; }
</style>
</head>
<body>

<div id="err" role="alert"></div>

<div id="topbar">
  <div id="status" aria-live="polite">已停止</div>
  速度 <span id="bpmValue" aria-live="polite">60</span> 拍/分
</div>

<div id="display" aria-hidden="true">
  <div id="flash"></div>
  <div id="bigBpm">60</div>
  <div id="bigBpmLabel">拍 / 分鐘</div>
  <div id="beatDots">
    <div class="dot downbeat" data-i="0"></div>
    <div class="dot" data-i="1"></div>
    <div class="dot" data-i="2"></div>
    <div class="dot" data-i="3"></div>
  </div>
</div>

<div id="hint" aria-hidden="true">使用下方按鈕開始、停止、加快或變慢。開啟手機的 TalkBack 即可聽取各按鈕功能。</div>

  <button class="btn btn-wide" id="btnVoice"><span aria-hidden="true">🎤</span> 語音設定速度</button>
<div id="controls">
  <button class="btn" id="btnSlower"><span aria-hidden="true">−</span> 變慢</button>
  <button class="btn" id="btnToggle">▶ 開始播放</button>
  <button class="btn" id="btnFaster"><span aria-hidden="true">＋</span> 加快</button>
</div>

<script>
(function () {
  "use strict";

  // ===== 狀態 =====
  let bpm = 60;
  const MIN_BPM = 40, MAX_BPM = 240;
  let beatsPerBar = 4;
  let isPlaying = false;

  // ===== Web Audio（節拍聲，非報讀） =====
  let audioCtx = null;
  let nextNoteTime = 0;
  let currentBeat = 0;
  let schedulerTimer = null;
  const lookahead = 25;
  const scheduleAhead = 0.12;

  const $ = (id) => document.getElementById(id);
  const elStatus = $("status");
  const elBpm = $("bpmValue");
  const elBigBpm = $("bigBpm");
  const elToggle = $("btnToggle");
  const elFlash = $("flash");
  const elDots = Array.from(document.querySelectorAll(".dot"));
  const elErr = $("err");

  function showErr(msg) { elErr.textContent = msg; elErr.style.display = "block"; clearTimeout(elErr._t); elErr._t = setTimeout(() => { elErr.style.display = "none"; }, 6000); }

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { showErr("此裝置不支援音效，節拍聲可能無法播放"); return; }
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  // 節拍聲 + 震動（給視障者非視覺回饋，不含語音報讀）
  function scheduleClick(beatNumber, time) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const isDownbeat = (beatNumber === 0);
    osc.frequency.value = isDownbeat ? 1000 : 800;
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.exponentialRampToValueAtTime(0.6, time + 0.003);
    gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.06);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(time); osc.stop(time + 0.07);

    const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
    if (navigator.vibrate) setTimeout(() => navigator.vibrate(isDownbeat ? 90 : 35), delay);
    setTimeout(() => flashBeat(isDownbeat), delay);
  }

  function flashBeat(isDownbeat) {
    elFlash.classList.toggle("downbeat", isDownbeat);
    elFlash.style.opacity = "0.55";
    setTimeout(() => { elFlash.style.opacity = "0"; }, 60);
    elDots.forEach((d, i) => d.classList.toggle("active", i === currentBeat % beatsPerBar));
  }

  function scheduler() {
    if (!audioCtx) return;
    while (nextNoteTime < audioCtx.currentTime + scheduleAhead) {
      scheduleClick(currentBeat % beatsPerBar, nextNoteTime);
      nextNoteTime += 60.0 / bpm;
      currentBeat++;
    }
  }
  function startScheduler() {
    ensureAudio(); if (!audioCtx) return;
    currentBeat = 0; nextNoteTime = audioCtx.currentTime + 0.06;
    schedulerTimer = setInterval(scheduler, lookahead);
  }
  function stopScheduler() { clearInterval(schedulerTimer); schedulerTimer = null; elDots.forEach((d) => d.classList.remove("active")); }

  // ===== 狀態更新（TalkBack 會透過 aria-live 自動報讀） =====
  function updateUI() {
    elBpm.textContent = bpm;
    elBigBpm.textContent = bpm;
    elStatus.textContent = isPlaying ? "播放中" : "已停止";
    const playing = isPlaying;
  elToggle.innerHTML = (playing ? '<span aria-hidden="true">■</span> ' : '<span aria-hidden="true">▶</span> ') + (playing ? "停止播放" : "開始播放");
    elToggle.classList.toggle("playing", playing);
  }

  function start() { if (isPlaying) return; isPlaying = true; startScheduler(); updateUI(); }
  function stop() { if (!isPlaying) return; isPlaying = false; stopScheduler(); updateUI(); }
  function toggle() { isPlaying ? stop() : start(); }
  function changeBpm(delta) {
    bpm = Math.max(MIN_BPM, Math.min(MAX_BPM, bpm + delta));
    updateUI();
  }
  function setBpm(v) {
    v = Math.round(v);
    if (isNaN(v)) return;
    bpm = Math.max(MIN_BPM, Math.min(MAX_BPM, v));
    updateUI();
  }

  // ===== 語音輸入速度（聽你說數字設定 BPM；App 本身不發聲） =====
  let recognition = null;
  let listening = false;

  function getRecognition() {
    if (recognition) return recognition;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.lang = "zh-TW";
    r.interimResults = false;
    r.maxAlternatives = 1;
    r.onresult = (e) => {
      let text = "";
      for (let i = e.resultIndex; i < e.results.length; i++) text += e.results[i][0].transcript;
      text = text.trim();
      if (text) handleVoice(text);
      stopListening();
    };
    r.onerror = (ev) => {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        showErr("語音輸入需要麥克風權限，請在網址列允許麥克風");
      }
      stopListening();
    };
    r.onend = () => { if (listening) stopListening(); };
    recognition = r;
    return r;
  }
  function startListening() {
    const r = getRecognition();
    if (!r) { showErr("此瀏覽器不支援語音輸入（建議用 Android 手機的 Chrome）"); return; }
    try { r.start(); listening = true; updateMicUI(); } catch (e) { /* 已在聆聽 */ }
  }
  function stopListening() {
    if (recognition && listening) { try { recognition.stop(); } catch (e) {} }
    listening = false; updateMicUI();
  }
  function updateMicUI() {
    const b = $("btnVoice");
    if (!b) return;
    b.innerHTML = listening
      ? '<span aria-hidden="true">🎤</span> 聆聽中…'
      : '<span aria-hidden="true">🎤</span> 語音設定速度';
    b.classList.toggle("listening", listening);
  }
  function parseNumber(text) {
    const m = text.match(/(\d{2,3})/);
    if (m) return parseInt(m[1], 10);
    return cnToNumber(text);
  }
  function cnUnder100(s) {
    const d = {零:0,〇:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
    if (/十/.test(s)) {
      const tm = s.match(/([一二兩三四五六七八九]?)十/);
      const tens = tm && tm[1] ? d[tm[1]] : 1;
      const om = s.match(/十([一二兩三四五六七八九])/);
      const ones = om ? d[om[1]] : 0;
      return tens * 10 + ones;
    }
    return d[s] !== undefined ? d[s] : NaN;
  }
  function cnToNumber(s) {
    const d = {零:0,〇:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
    if (/百/.test(s)) {
      const hm = s.match(/([一二兩三四五六七八九]?)百/);
      const hundreds = hm && hm[1] ? d[hm[1]] : 1;
      const rm = s.match(/百(.+)$/);
      return hundreds * 100 + (rm ? cnUnder100(rm[1]) : 0);
    }
    return cnUnder100(s);
  }
  function handleVoice(text) {
    const n = parseNumber(text);
    if (!isNaN(n)) { setBpm(n); return; }
    if (text.includes("開始") || text.includes("播放")) start();
    else if (text.includes("停止") || text.includes("暫停")) stop();
    else if (text.includes("加快") || text.includes("快一點")) changeBpm(4);
    else if (text.includes("變慢") || text.includes("慢一點")) changeBpm(-4);
    else if (text.includes("重置") || text.includes("重來")) setBpm(60);
  }

  // ===== 事件 =====
  $("btnToggle").addEventListener("click", () => { ensureAudio(); toggle(); });
  $("btnSlower").addEventListener("click", () => { changeBpm(-4); });
  $("btnFaster").addEventListener("click", () => { changeBpm(4); });
  $("btnVoice").addEventListener("click", (e) => {
    e.stopPropagation();
    if (listening) stopListening(); else startListening();
  });

  // 鍵盤快捷鍵（桌面）
  document.addEventListener("keydown", (e) => {
    if (e.target === document.body) {
      if (e.code === "Space") { e.preventDefault(); ensureAudio(); toggle(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); changeBpm(1); }
      else if (e.key === "ArrowDown") { e.preventDefault(); changeBpm(-1); }
    }
  });

  // ===== PWA Service Worker =====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }

  updateUI();
})();
</script>
</body>
</html>
