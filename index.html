<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>語音節拍器</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="專為視障者設計、搭配 TalkBack 使用的節拍器">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff;
    font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    overflow: hidden; user-select: none;
  }
  body { display: flex; flex-direction: column; }

  /* 頂部狀態列（TalkBack 會自動報讀這裡的變化） */
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: env(safe-area-inset-top) 16px 8px;
    text-align: center; font-size: 18px; line-height: 1.5;
    background: #111;
  }
  #topbar #btnToggle { flex: 0 0 auto; min-height: 44px; font-size: 18px; padding: 0 18px; }
  #status { font-weight: bold; }
  #bpmValue { font-size: 22px; color: #FFD54A; font-weight: bold; }

  /* 主顯示區（純視覺，TalkBack 不需讀這裡，因頂部已報讀） */
  #display {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #000;
    position: relative;
  }
  #bigBpm { font-size: 120px; font-weight: 900; line-height: 1; color: #FFD54A; }
  #bigBpmLabel { font-size: 20px; color: #aaa; margin-top: 4px; }
  #beatDots { display: flex; gap: 14px; margin-top: 24px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: #333; border: 2px solid #555; }
  .dot.active { background: #FFD54A; border-color: #FFD54A; }
  .dot.downbeat.active { background: #fff; border-color: #fff; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 0.04s; }
  #flash.downbeat { background: #FFD54A; }

  /* 操作說明（給明眼人看；TalkBack 也會讀一次） */
  #hint { text-align: center; font-size: 14px; color: #888; padding: 6px 16px; background: #0a0a0a; line-height: 1.5; }

  /* 底部操作按鈕（TalkBack 主要報讀對象） */
  #controls { padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); background: #111; display: flex; gap: 10px; }
  .btn {
    flex: 1; min-height: 72px; font-size: 22px; font-weight: bold;
    border: none; border-radius: 14px; color: #fff;
    display: flex; align-items: center; justify-content: center;
    background: #1f6feb;
  }
  .btn:active { transform: scale(0.97); }
  #btnSlower { background: #424242; }
  #btnFaster { background: #424242; }
  #btnToggle { background: #2e7d32; }
  #btnToggle.playing { background: #c62828; }
  .btn-wide { width: 100%; }
  #btnVoice { background: #6a1b9a; min-height: 64px; font-size: 20px; }
  #btnVoice.listening { background: #c62828; }
  #settings { padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 8px; }
  .field { display: flex; align-items: center; gap: 10px; }
  .field label { flex: 0 0 96px; font-size: 15px; color: #ccc; }
  .field select { flex: 1; min-height: 44px; font-size: 16px; border-radius: 10px; border: 1px solid #444; background: #1a1a1a; color: #fff; padding: 0 10px; }

  #err { position: fixed; top: 0; left: 0; right: 0; background: #b71c1c; color: #fff; padding: 12px 16px; font-size: 15px; display: none; z-index: 99; }
</style>
</head>
<body>

<div id="err" role="alert"></div>

<div id="topbar">
  <span id="speedText">速度 <span id="bpmValue" aria-live="polite">60</span></span>
  <button class="btn" id="btnToggle">▶ 開始播放</button>
</div>

<div id="display" aria-hidden="true">
  <div id="flash"></div>
  <div id="bigBpm">60</div>
  <div id="bigBpmLabel">拍 / 分鐘</div>
  <div id="beatDots">
    <div class="dot downbeat" data-i="0" aria-hidden="true"></div>
    <div class="dot" data-i="1" aria-hidden="true"></div>
    <div class="dot" data-i="2" aria-hidden="true"></div>
    <div class="dot" data-i="3" aria-hidden="true"></div>
  </div>
</div>

<div id="hint" aria-hidden="true">使用下方按鈕開始、停止、加快或變慢。開啟手機的 TalkBack 即可聽取各按鈕功能。</div>

  <button class="btn btn-wide" id="btnVoice"><span aria-hidden="true">🎤</span> 語音設定速度</button>
  <div id="settings">
    <div class="field">
      <label for="meterSelect">拍數</label>
      <select id="meterSelect">
        <option value="2">2/4 拍</option>
        <option value="3">3/4 拍</option>
        <option value="4" selected>4/4 拍</option>
        <option value="5">5/4 拍</option>
        <option value="6">6/8 拍</option>
      </select>
    </div>
    <div class="field">
      <label for="soundSelect">音效</label>
      <select id="soundSelect">
        <option value="classic" selected>原聲（滴噠）</option>
        <option value="high">高音</option>
        <option value="voice">人聲數拍</option>
      </select>
    </div>
    <div class="field">
      <label for="cueSelect">提示音在第幾拍</label>
      <select id="cueSelect">
        <option value="1" selected>第 1 拍</option>
      </select>
    </div>
  </div>
<div id="controls">
  <button class="btn" id="btnSlower"><span aria-hidden="true">−</span> 變慢</button>
  <button class="btn" id="btnFaster"><span aria-hidden="true">＋</span> 加快</button>
</div>

<script>
(function () {
  "use strict";

  // ===== 狀態 =====
  let bpm = 60;
  const MIN_BPM = 40, MAX_BPM = 240;
  let beatsPerBar = 4;
  let isPlaying = false;

  // ===== Web Audio（節拍聲，非報讀） =====
  let audioCtx = null;
  let masterGain = null;
  let limiter = null;
  let soundType = "classic";
  let cueBeats = [1];
  let voiceZH = null;
  let nextNoteTime = 0;
  let currentBeat = 0;
  let beatInBar = 1;
  let schedulerTimer = null;
  const lookahead = 25;
  const scheduleAhead = 0.12;

  const $ = (id) => document.getElementById(id);
  const elBpm = $("bpmValue");
  const elBigBpm = $("bigBpm");
  const elToggle = $("btnToggle");
  const elFlash = $("flash");
  const elDots = Array.from(document.querySelectorAll(".dot"));
  const elErr = $("err");

  function showErr(msg) { elErr.textContent = msg; elErr.style.display = "block"; clearTimeout(elErr._t); elErr._t = setTimeout(() => { elErr.style.display = "none"; }, 6000); }

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { showErr("此裝置不支援音效，節拍聲可能無法播放"); return; }
      audioCtx = new AC();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 1.6;
      limiter = audioCtx.createDynamicsCompressor();
      limiter.threshold.value = -1;
      limiter.knee.value = 0;
      limiter.ratio.value = 12;
      limiter.attack.value = 0.002;
      limiter.release.value = 0.12;
      masterGain.connect(limiter);
      limiter.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  // 節拍聲 + 震動（給視障者非視覺回饋，不含語音報讀）
  let noiseBuf = null;
  function getNoiseBuffer() {
    if (noiseBuf) return noiseBuf;
    const len = Math.floor(audioCtx.sampleRate * 0.05);
    noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    return noiseBuf;
  }

  // 單音（音調成分）
  function tone(time, freq, wave, peak, dur, slide) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = wave;
    osc.frequency.setValueAtTime(freq, time);
    if (slide) osc.frequency.exponentialRampToValueAtTime(freq * 0.5, time + dur);
    g.gain.setValueAtTime(0.0001, time);
    g.gain.exponentialRampToValueAtTime(peak, time + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(time); osc.stop(time + dur + 0.01);
  }
  // 噪聲打擊瞬間
  function noiseBurst(time, freq, peak, dur) {
    if (!audioCtx) return;
    const n = audioCtx.createBufferSource();
    n.buffer = getNoiseBuffer();
    const f = audioCtx.createBiquadFilter();
    f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 0.8;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(peak, time);
    g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
    n.connect(f); f.connect(g); g.connect(masterGain);
    n.start(time); n.stop(time + dur + 0.01);
  }
  // 人聲數拍（語音合成，限「人聲」音效）
  function speakCount(localBeat) {
    if (!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(String(localBeat));
    u.lang = "zh-TW";
    u.rate = 1.1;
    u.pitch = 1.1;
    u.volume = 1.0;
    if (voiceZH) u.voice = voiceZH;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }
  // 依音效類型播放節拍聲；accent=提示音拍位（重音）
  function playSound(type, beatNumber, time, isAccent, localBeat) {
    if (type === "voice") {
      const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
      setTimeout(() => speakCount(localBeat), delay);
      return;
    }
    if (type === "high") {
      // 尖銳高音（方波，無滑音）
      tone(time, accent ? 2600 : 1900, "square", 0.6, 0.03, false);
      noiseBurst(time, accent ? 3200 : 2200, 0.25, 0.02);
    } else { // classic（原來設定的聲音：滴噠）
      tone(time, accent ? 1250 : 830, "triangle", 0.9, 0.045, true);
      noiseBurst(time, accent ? 2400 : 1300, 0.32, 0.03);
    }
  }

  function scheduleClick(beatNumber, time, localBeat) {
    if (!audioCtx) return;
    const isAccent = cueBeats.includes(localBeat);
    playSound(soundType, beatNumber, time, isAccent, localBeat);
    const delay = Math.max(0, (time - audioCtx.currentTime) * 1000);
    if (navigator.vibrate) setTimeout(() => navigator.vibrate(isAccent ? 90 : 35), delay);
    setTimeout(() => flashBeat(isAccent), delay);
  }

  function flashBeat(isDownbeat) {
    elFlash.classList.toggle("downbeat", isDownbeat);
    elFlash.style.opacity = "0.55";
    setTimeout(() => { elFlash.style.opacity = "0"; }, 60);
    elDots.forEach((d, i) => d.classList.toggle("active", i === beatNumber));
  }

  function scheduler() {
    if (!audioCtx) return;
    while (nextNoteTime < audioCtx.currentTime + scheduleAhead) {
      scheduleClick(currentBeat % beatsPerBar, nextNoteTime, beatInBar);
      nextNoteTime += 60.0 / bpm;
      currentBeat++;
      beatInBar = (beatInBar % beatsPerBar) + 1;
    }
  }
  function startScheduler() {
    ensureAudio(); if (!audioCtx) return;
    currentBeat = 0; beatInBar = 1; nextNoteTime = audioCtx.currentTime + 0.06;
    schedulerTimer = setInterval(scheduler, lookahead);
  }
  function stopScheduler() { clearInterval(schedulerTimer); schedulerTimer = null; elDots.forEach((d) => d.classList.remove("active")); }

  // ===== 狀態更新（TalkBack 會透過 aria-live 自動報讀） =====
  function updateUI() {
    elBpm.textContent = bpm;
    elBigBpm.textContent = bpm;
    const playing = isPlaying;
  elToggle.innerHTML = (playing ? '<span aria-hidden="true">■</span> ' : '<span aria-hidden="true">▶</span> ') + (playing ? "停止播放" : "開始播放");
    elToggle.classList.toggle("playing", playing);
  }

  function start() { if (isPlaying) return; isPlaying = true; startScheduler(); updateUI(); }
  function stop() { if (!isPlaying) return; isPlaying = false; stopScheduler(); updateUI(); }
  function toggle() { isPlaying ? stop() : start(); }
  function changeBpm(delta) {
    bpm = Math.max(MIN_BPM, Math.min(MAX_BPM, bpm + delta));
    updateUI();
  }
  function setBpm(v) {
    v = Math.round(v);
    if (isNaN(v)) return;
    bpm = Math.max(MIN_BPM, Math.min(MAX_BPM, v));
    updateUI();
  }

  // ===== 語音輸入速度（聽你說數字設定 BPM；App 本身不發聲） =====
  let recognition = null;
  let listening = false;

  function getRecognition() {
    if (recognition) return recognition;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return null;
    const r = new SR();
    r.lang = "zh-TW";
    r.interimResults = false;
    r.maxAlternatives = 1;
    r.onresult = (e) => {
      let text = "";
      for (let i = e.resultIndex; i < e.results.length; i++) text += e.results[i][0].transcript;
      text = text.trim();
      if (text) handleVoice(text);
      stopListening();
    };
    r.onerror = (ev) => {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") {
        showErr("語音輸入需要麥克風權限，請在網址列允許麥克風");
      }
      stopListening();
    };
    r.onend = () => { if (listening) stopListening(); };
    recognition = r;
    return r;
  }
  function startListening() {
    const r = getRecognition();
    if (!r) { showErr("此瀏覽器不支援語音輸入（建議用 Android 手機的 Chrome）"); return; }
    try { r.start(); listening = true; updateMicUI(); } catch (e) { /* 已在聆聽 */ }
  }
  function stopListening() {
    if (recognition && listening) { try { recognition.stop(); } catch (e) {} }
    listening = false; updateMicUI();
  }
  function updateMicUI() {
    const b = $("btnVoice");
    if (!b) return;
    b.innerHTML = listening
      ? '<span aria-hidden="true">🎤</span> 聆聽中…'
      : '<span aria-hidden="true">🎤</span> 語音設定速度';
    b.classList.toggle("listening", listening);
  }
  function parseNumber(text) {
    const m = text.match(/(\d{2,3})/);
    if (m) return parseInt(m[1], 10);
    return cnToNumber(text);
  }
  function cnUnder100(s) {
    const d = {零:0,〇:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
    if (/十/.test(s)) {
      const tm = s.match(/([一二兩三四五六七八九]?)十/);
      const tens = tm && tm[1] ? d[tm[1]] : 1;
      const om = s.match(/十([一二兩三四五六七八九])/);
      const ones = om ? d[om[1]] : 0;
      return tens * 10 + ones;
    }
    return d[s] !== undefined ? d[s] : NaN;
  }
  function cnToNumber(s) {
    const d = {零:0,〇:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
    if (/百/.test(s)) {
      const hm = s.match(/([一二兩三四五六七八九]?)百/);
      const hundreds = hm && hm[1] ? d[hm[1]] : 1;
      const rm = s.match(/百(.+)$/);
      return hundreds * 100 + (rm ? cnUnder100(rm[1]) : 0);
    }
    return cnUnder100(s);
  }
  function handleVoice(text) {
    const n = parseNumber(text);
    if (!isNaN(n)) { setBpm(n); return; }
    if (text.includes("開始") || text.includes("播放")) start();
    else if (text.includes("停止") || text.includes("暫停")) stop();
    else if (text.includes("加快") || text.includes("快一點")) changeBpm(5);
    else if (text.includes("變慢") || text.includes("慢一點")) changeBpm(-5);
    else if (text.includes("重置") || text.includes("重來")) setBpm(60);
  }

  // ===== 事件 =====
  $("btnToggle").addEventListener("click", () => { ensureAudio(); toggle(); });
  $("btnSlower").addEventListener("click", () => { changeBpm(-5); });
  $("btnFaster").addEventListener("click", () => { changeBpm(5); });
  $("btnVoice").addEventListener("click", (e) => {
    e.stopPropagation();
    if (listening) stopListening(); else startListening();
  });

  // 下拉選單：拍數 / 音效 / 提示音拍位
  const meterSel = $("meterSelect");
  const cueSel = $("cueSelect");
  function setMeter(n) {
    beatsPerBar = n;
    const prev = cueSel.value;
    cueSel.innerHTML = "";
    for (let i = 1; i <= n; i++) {
      const o = document.createElement("option");
      o.value = String(i);
      o.textContent = "第 " + i + " 拍";
      cueSel.appendChild(o);
    }
    if (n >= 4) {
      const a = document.createElement("option");
      a.value = "1,3"; a.textContent = "1,3 拍"; cueSel.appendChild(a);
      const b = document.createElement("option");
      b.value = "2,4"; b.textContent = "2,4 拍"; cueSel.appendChild(b);
    }
    cueSel.value = [...cueSel.options].some((o) => o.value === prev) ? prev : "1";
    cueBeats = cueSel.value.split(",").map(Number);
  }
  meterSel.addEventListener("change", () => setMeter(parseInt(meterSel.value, 10)));
  $("soundSelect").addEventListener("change", (e) => { soundType = e.target.value; });
  cueSel.addEventListener("change", () => { cueBeats = cueSel.value.split(",").map(Number); });
  setMeter(parseInt(meterSel.value, 10));

  // 鍵盤快捷鍵（桌面）
  document.addEventListener("keydown", (e) => {
    if (e.target === document.body) {
      if (e.code === "Space") { e.preventDefault(); ensureAudio(); toggle(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); changeBpm(1); }
      else if (e.key === "ArrowDown") { e.preventDefault(); changeBpm(-1); }
    }
  });

  // ===== PWA Service Worker =====
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }

  // 選用中文語音（人聲數拍）
  if ("speechSynthesis" in window) {
    const pickVoice = () => {
      const vs = window.speechSynthesis.getVoices();
      voiceZH = vs.find((v) => /zh|tw|中文|台/i.test(v.lang + " " + v.name))
             || vs.find((v) => v.lang && v.lang.toLowerCase().startsWith("zh"))
             || null;
    };
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }

  updateUI();
})();
</script>
</body>
</html>
